name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: publish userscript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify the tag matches the userscript version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's|^// @version[[:space:]]*||p' google_snake_bot_user.js | tr -d '\r')
          TAG=${GITHUB_REF_NAME#v}
          echo "userscript: $VERSION / tag: $TAG"
          node -e "const a='$VERSION'.split('.').map(Number); const b='$TAG'.split('.').map(Number); for (let i=0;i<3;i++){ if((a[i]||0)!==(b[i]||0)) { console.error('version mismatch'); process.exit(1);} }"

      - name: Run tests before publishing
        run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            google_snake_bot_user.js \
            --title "SnakeBot ${GITHUB_REF_NAME}" \
            --generate-notes
